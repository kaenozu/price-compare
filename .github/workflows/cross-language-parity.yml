name: Cross-language parity

on:
  pull_request:
    paths:
      - "test_vectors/**"
      - "reference_impl/**"
      - "src/**"
      - "flutter_app/lib/engine/**"
      - "flutter_app/test/engine/shared_vector_parity_test.dart"
      - ".github/workflows/cross-language-parity.yml"
  push:
    branches:
      - main
    paths:
      - "test_vectors/**"
      - "reference_impl/**"
      - "src/**"
      - "flutter_app/lib/engine/**"
      - "flutter_app/test/engine/shared_vector_parity_test.dart"
      - ".github/workflows/cross-language-parity.yml"

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python reference
        run: |
          python -m pip install pytest
          python -m pytest -q reference_impl/test_shared_vector_parity.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Kotlin engine
        run: gradle jvmTest

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Verify Dart engine
        working-directory: flutter_app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed test/engine/shared_vector_parity_test.dart
          flutter test test/engine/shared_vector_parity_test.dart
