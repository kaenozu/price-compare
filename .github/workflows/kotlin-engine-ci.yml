name: Kotlin Engine CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "reference_impl/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kotlin-engine-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "reference_impl/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kotlin-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Run Kotlin engine tests
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          bash ./gradlew jvmTest --no-daemon --stacktrace
