name: Kotlin Engine CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "reference_impl/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kotlin-engine-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "reference_impl/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kotlin-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Kotlin engine tests
        run: bash ./gradlew jvmTest --no-daemon --stacktrace
