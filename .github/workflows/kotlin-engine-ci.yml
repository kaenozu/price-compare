name: Kotlin Engine CI

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "reference_impl/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kotlin-engine-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "reference_impl/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/kotlin-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kotlin-engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fetch repository snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir source
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            | tar -xz --strip-components=1 -C source

      - name: Run Kotlin engine tests
        working-directory: source
        shell: bash
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          bash ./gradlew jvmTest --no-daemon --stacktrace
